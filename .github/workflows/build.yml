name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify build
        shell: pwsh
        run: .\scripts\Verify-Build.ps1 -Configurations Release

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msbuild-logs
          path: artifacts/*.log
          if-no-files-found: ignore
